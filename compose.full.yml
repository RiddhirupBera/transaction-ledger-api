name: ledgerflow
services:
  mongo:
    image: mongo:8.0
    command: [mongod, --replSet, rs0, --bind_ip_all]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
      - ./docker/init-replica.js:/init-replica.js:ro
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--host', 'localhost:27017', '/init-replica.js']
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      MONGODB_URI: mongodb://mongo:27017/ledgerflow?replicaSet=rs0&directConnection=true
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health', {signal: AbortSignal.timeout(3000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${WEB_PORT:-8080}:80'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/api/health']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

volumes:
  mongo-data:
