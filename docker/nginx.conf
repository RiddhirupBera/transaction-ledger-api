server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 32k;
    error_page 413 = @request_too_large;

    location @request_too_large {
        default_type application/json;
        return 400 '{"error":{"code":"BODY_TOO_LARGE","message":"Request body is too large"}}';
    }

    # Re-resolve Docker service DNS if the API container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://server:3000;

    location /api/ {
        # No URI suffix: preserve /api and all original query parameters.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
